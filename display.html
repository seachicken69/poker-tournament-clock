<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>錦標賽儀錶板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#5520E8;
  --bg-deep:#4718C9;
  --panel:rgba(0,0,0,.20);
  --panel-line:rgba(255,255,255,.32);
  --fg:#FFFFFF;
  --fg-dim:rgba(255,255,255,.78);
  --fg-faint:rgba(255,255,255,.50);
  --vgap:clamp(14px,2.4vh,28px);
  --serif:'Cinzel','Noto Serif TC',serif;
  --mono:'IBM Plex Mono','Noto Sans TC',monospace;
  --digit:'DSEG7-Classic',var(--mono);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--mono);font-weight:700;
  min-height:100vh;display:flex;flex-direction:column;
  overflow:hidden;user-select:none;position:relative;
}

/* ── Atmosphere（單色：只用同色深淺與白色透明度）── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(255,255,255,.10), transparent 60%),
    radial-gradient(ellipse 80% 70% at 50% 110%, rgba(0,0,0,.28), transparent 60%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 26px),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 26px);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  box-shadow:inset 0 0 22vw rgba(0,0,0,.45);
}
.suit{
  position:fixed;z-index:0;pointer-events:none;
  font-family:Georgia,serif;color:#fff;opacity:.06;
  font-size:26vw;line-height:1;filter:blur(.5px);
}
.suit.tl{top:-9vw;left:-7vw;transform:rotate(-12deg)}
.suit.br{bottom:-9vw;right:-7vw;transform:rotate(168deg)}

/* ── Marquee header ── */
.header{
  position:relative;z-index:1;padding:16px 28px 14px;text-align:center;
  border-bottom:2px solid var(--panel-line);
  background:linear-gradient(180deg, rgba(0,0,0,.18), transparent);
}
.header::before{
  content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.6) 50%, transparent);
}
.header-row{display:flex;align-items:center;justify-content:center;gap:18px}
.diamond{color:var(--fg);font-size:clamp(10px,1vw,14px);opacity:.85;flex-shrink:0}
.t-name{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(20px,2.6vw,34px);
  letter-spacing:.18em;text-transform:uppercase;color:var(--fg);
}
.subtitle{margin-top:5px;font-size:clamp(9px,.8vw,11px);letter-spacing:.4em;color:var(--fg-dim);text-transform:uppercase;font-weight:700}

/* ── Main 3-column grid ── */
.main{
  position:relative;z-index:1;
  flex:1;display:grid;
  grid-template-columns:1fr 1.7fr 1fr;
  gap:18px;padding:20px 26px;min-height:0;
}

/* ── Plaques (info boxes) ── */
.col-side{display:flex;flex-direction:column;gap:14px;justify-content:center}
.plaque{
  position:relative;
  background:var(--panel);
  border:2px solid var(--panel-line);
  border-radius:8px;padding:14px 16px;text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.30);
}
.plaque::before{
  content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.16);
  border-radius:4px;pointer-events:none;
}
.plaque-label{
  font-size:clamp(10px,.85vw,12px);color:var(--fg-dim);
  text-transform:uppercase;letter-spacing:.22em;margin-bottom:7px;font-weight:700;
}
.plaque-value{
  font-family:var(--mono);font-weight:700;
  font-size:clamp(30px,3.6vw,48px);
  color:var(--fg);letter-spacing:.02em;white-space:nowrap;
  line-height:1.15;
}
/* 平均籌碼的 BB 行：與碼量同字級 */
.plaque-value.bb{margin-top:2px}
.plaque-value.bb .unit{font-size:.62em;margin-left:.18em;letter-spacing:.06em;vertical-align:baseline}

/* ── Center stage ── */
.col-center{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
}
.ribbon{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(26px,3vw,44px);
  color:var(--fg);letter-spacing:.32em;text-transform:uppercase;
  margin-bottom:var(--vgap);
}
.stage{position:relative;display:flex;align-items:center;justify-content:center;margin:0 0 var(--vgap)}
.timer{
  font-family:var(--digit);font-weight:700;
  font-size:clamp(80px,13vw,168px);line-height:1;
  color:var(--fg);
  letter-spacing:.02em;
}
/* 單色主題：不用變色，改用閃爍強度區分 */
.timer.warning{animation:pulse 1.6s ease-in-out infinite}
.timer.danger{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* 加時賽：木魚敲擊動畫（功德 +1，參考經典梗圖） */
.muyu{display:none;width:min(46vh,60vw);height:min(46vh,60vw);position:relative}
.muyu svg{width:100%;height:100%;overflow:visible}
.stage.ot .timer{display:none}
.stage.ot .muyu{display:block}
/* 槌子：兩層動作 — 整支手臂下沉（右端也一起往下），槌頭以右端為軸擺下；
   回彈時槌頭先歸位，手臂慢一拍才回到原高度 */
.muyu .arm{animation:armDown 1.1s infinite}
@keyframes armDown{
  0%,38%{transform:translateY(0);animation-timing-function:ease-in}
  46%{transform:translateY(8px)}
  54%{transform:translateY(8px);animation-timing-function:ease-out}
  80%,100%{transform:translateY(0)}
}
.muyu .mallet{transform-origin:250px 50px;animation:malletHit 1.1s infinite}
@keyframes malletHit{
  0%,38%{transform:rotate(0deg);animation-timing-function:ease-in}
  46%{transform:rotate(-8deg)}
  54%{transform:rotate(-8deg);animation-timing-function:ease-out}
  64%,100%{transform:rotate(0deg)}
}
/* 木魚：被敲時微微壓扁 */
.muyu .fish{transform-origin:150px 230px;animation:fishSquash 1.1s ease-out infinite}
@keyframes fishSquash{
  0%,45%,58%,100%{transform:scale(1,1)}
  48%{transform:scale(1.03,.95)}
}
/* +1：敲到時彈出、上飄淡出 */
.muyu .plus{opacity:0;transform-origin:150px 16px;animation:plusPop 1.1s ease-out infinite}
@keyframes plusPop{
  0%,45%{opacity:0;transform:translateY(0) scale(.7)}
  50%{opacity:1;transform:translateY(-6px) scale(1.1)}
  100%{opacity:0;transform:translateY(-44px) scale(1)}
}

.status-badge{
  position:relative;
  font-size:clamp(11px,1.1vw,14px);font-weight:700;font-family:var(--mono);
  padding:7px 26px;border-radius:30px;text-transform:uppercase;letter-spacing:.28em;
  background:rgba(0,0,0,.22);color:var(--fg);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);
}
.s-running {box-shadow:inset 0 0 0 2px #fff, 0 0 16px rgba(255,255,255,.25)}
.s-paused  {background:#fff;color:var(--bg)}                 /* 反白：暫停要一眼看到 */
.s-break   {box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);border:2px dashed rgba(255,255,255,.7)}
.s-idle, .s-finished {color:var(--fg-dim);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}

.rebuy-info{font-size:clamp(13px,1.3vw,17px);color:var(--fg-dim);text-align:center;letter-spacing:.04em;font-weight:700;margin-top:var(--vgap)}
.rebuy-info:empty{display:none}
.next-preview{font-size:clamp(15px,1.5vw,20px);color:var(--fg);opacity:.9;margin-top:var(--vgap);letter-spacing:.08em;text-transform:uppercase;font-weight:700}

/* ── Blinds rail ── */
.blinds-bar{
  position:relative;z-index:1;
  background:var(--bg-deep);
  border-top:2px solid var(--panel-line);
  display:grid;grid-template-columns:1fr 1fr 1fr;
  padding:4px 0 2px;
}
.blind-cell{position:relative;padding:14px 10px 16px;text-align:center}
.blind-cell + .blind-cell::before{
  content:'♦';position:absolute;left:0;top:50%;transform:translate(-50%,-50%);
  color:var(--fg);font-size:13px;opacity:.7;
}
.blind-label{
  font-size:clamp(10px,.85vw,12px);color:var(--fg-dim);text-transform:uppercase;
  letter-spacing:.3em;margin-bottom:7px;font-weight:700;
}
.blind-value{
  font-family:var(--mono);font-weight:700;
  font-size:clamp(38px,6vw,76px);
  color:var(--fg);
}
</style>
</head>
<body>

<div class="suit tl">♠</div>
<div class="suit br">♥</div>

<div class="header">
  <div class="header-row">
    <span class="diamond">◆</span>
    <div class="t-name" id="t-name">AK 錦標賽</div>
    <span class="diamond">◆</span>
  </div>
  <div class="subtitle">Tournament Clock</div>
</div>

<div class="main">
  <!-- Left -->
  <div class="col-side">
    <div class="plaque">
      <div class="plaque-label">剩餘人數</div>
      <div class="plaque-value" id="players-rem">-</div>
    </div>
    <div class="plaque">
      <div class="plaque-label">總買入</div>
      <div class="plaque-value" id="total-buyins">-</div>
    </div>
  </div>

  <!-- Center -->
  <div class="col-center">
    <div class="ribbon" id="level-label">LEVEL 1</div>
    <div class="stage" id="stage">
      <div class="timer" id="timer">--:--</div>
      <div class="muyu" id="muyu" aria-label="加時賽進行中">
        <svg viewBox="24 -14 260 262" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
          <!-- 功德 +1（敲擊時一起彈出、上飄淡出） -->
          <g class="plus" fill="#fff" font-family="'Noto Sans TC','IBM Plex Mono',sans-serif" font-weight="900" font-size="32">
            <text x="150" y="16" text-anchor="middle" letter-spacing="2">功德 +1</text>
          </g>
          <!-- 木魚本體：咖啡色、黑描邊；左側收成縮口，深色開口橫過中間 -->
          <g class="fish">
            <path d="M56 177 C60 170, 64 167, 70 165 C80 146, 96 124, 116 112 C146 91, 202 88, 228 124 C248 158, 230 208, 188 220 C152 230, 112 223, 86 208 C74 201, 64 194, 62 187 C60 184, 57 181, 56 177 Z"
                  fill="#B5813F" stroke="#111" stroke-width="6"/>
            <ellipse cx="61" cy="178" rx="4" ry="3" fill="#111" transform="rotate(-35 61 175)"/>
            <path d="M108 163 Q172 146 236 160" fill="none" stroke="#111" stroke-width="12"/>
          </g>
          <!-- 槌子：橫放，白柄黑邊，左端黑色大圓頭在木魚正上方 -->
          <g class="arm">
          <g class="mallet">
            <line x1="152" y1="50" x2="250" y2="50" stroke="#111" stroke-width="12"/>
            <line x1="154" y1="50" x2="248" y2="50" stroke="#f2f2f2" stroke-width="6"/>
            <circle cx="140" cy="50" r="22" fill="#111"/>
            <ellipse cx="132" cy="41" rx="6" ry="4" fill="#fff" opacity=".85" transform="rotate(-30 132 41)"/>
          </g>
          </g>
        </svg>
      </div>
    </div>
    <div class="status-badge s-idle" id="status-badge">等待開始</div>
    <div class="rebuy-info" id="rebuy-info"></div>
    <div class="next-preview" id="next-preview"></div>
  </div>

  <!-- Right -->
  <div class="col-side">
    <div class="plaque">
      <div class="plaque-label">平均籌碼</div>
      <div class="plaque-value" id="avg-chips">-</div>
      <div class="plaque-value bb" id="avg-bb"></div>
    </div>
    <div class="plaque">
      <div class="plaque-label">獎池</div>
      <div class="plaque-value" id="prize-pool">$0</div>
    </div>
  </div>
</div>

<div class="blinds-bar">
  <div class="blind-cell">
    <div class="blind-label">Small Blind 小盲</div>
    <div class="blind-value" id="sb">-</div>
  </div>
  <div class="blind-cell">
    <div class="blind-label">Big Blind 大盲</div>
    <div class="blind-value" id="bb">-</div>
  </div>
  <div class="blind-cell">
    <div class="blind-label">Ante 前注</div>
    <div class="blind-value" id="ante">0</div>
  </div>
</div>

<script>
const SB_URL  = 'https://nezsuytdkonbvonzmdlj.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lenN1eXRka29uYnZvbnptZGxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMjY2MDYsImV4cCI6MjA5MTcwMjYwNn0.upQMNjJoS20cEi41aWDKJjTko7Y7aBfaMjHvdiMvZJA';
const { createClient } = supabase;
const sb = createClient(SB_URL, SB_ANON);

let T = null;   // tournament
let BL = [];    // blind_levels


// ── Load ──────────────────────────────────────────────
async function load() {
  const { data: t } = await sb.from('tournaments').select('*')
    .eq('is_active', true).maybeSingle();
  if (!t) return;
  T = t;
  const { data: bl } = await sb.from('blind_levels').select('*')
    .eq('tournament_id', t.id).order('level_order');
  BL = bl || [];
  render();
}

function subscribe() {
  sb.channel('display-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments' }, load)
    .subscribe();
}

// ── Helpers ───────────────────────────────────────────
function curLevel()  { return BL.find(l => l.level_order === T.current_level) }
function nextLevel() { return BL.find(l => l.level_order === T.current_level + 1) }

function remainingSecs() {
  if (!T || !curLevel()) return 0;
  if (T.status === 'paused') return T.pause_remaining_secs || 0;
  if (T.status === 'running' || T.status === 'break') {
    const elapsed = (Date.now() - new Date(T.level_start_at).getTime()) / 1000;
    return Math.max(0, curLevel().duration_minutes * 60 - elapsed);
  }
  return curLevel().duration_minutes * 60;
}

function fmt(s)    { s=Math.max(0,Math.floor(s)); return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}` }
function num(n)    { return (n||0).toLocaleString() }
function numK(n) {
  n = n || 0;
  if (n >= 1000) {
    const k = n / 1000;
    return (Number.isInteger(k) ? k : k.toFixed(1).replace(/\.0$/,'')) + 'K';
  }
  return String(n);
}

// ── Render ────────────────────────────────────────────
function render() {
  if (!T) return;
  checkLevelSound();
  checkOvertimeDoneSound();
  document.getElementById('t-name').textContent = T.name;
  document.getElementById('players-rem').textContent   = T.players_remaining || '-';
  document.getElementById('total-buyins').textContent  = T.total_buy_ins ? num(T.total_buy_ins) : '-';
  const gross    = (T.total_buy_ins || 0) * (T.buy_in_amount || 0);
  const rate     = (T.reserve_rate  || 0) / 100;
  const netPrize = Math.floor(gross * (1 - rate));
  document.getElementById('prize-pool').textContent = `$${num(netPrize)}`;
  document.getElementById('rebuy-info').textContent = '';

  // Avg chips（並換算成目前級別的 BB 數，與碼量同字級）
  const avgEl = document.getElementById('avg-chips');
  const bbEl  = document.getElementById('avg-bb');
  const curL  = curLevel();
  if (T.total_buy_ins && T.starting_chips && T.players_remaining) {
    const avg = Math.floor(T.total_buy_ins * T.starting_chips / T.players_remaining);
    avgEl.textContent = num(avg);
    if (curL && !curL.is_break && curL.big_blind > 0) {
      bbEl.innerHTML = `${Math.floor(avg / curL.big_blind)}<span class="unit">BB</span>`;
    } else {
      bbEl.textContent = '';
    }
  } else {
    avgEl.textContent = '-';
    bbEl.textContent = '';
  }

  // Status badge
  const badge = document.getElementById('status-badge');
  const sm = { idle:'等待開始',running:'進行中',paused:'暫停中',break:'休息中',finished:'已結束',overtime:'加時賽進行中',overtime_done:'加時賽結束' };
  const sc = { idle:'s-idle',running:'s-running',paused:'s-paused',break:'s-break',finished:'s-finished',overtime:'s-paused',overtime_done:'s-finished' };
  badge.textContent = sm[T.status] || '-';
  badge.className = `status-badge ${sc[T.status] || 's-idle'}`;

  const cl = curLevel();
  const nl = nextLevel();
  const stage = document.getElementById('stage');
  const isOT = T.status === 'overtime' || T.status === 'overtime_done';
  stage.classList.toggle('ot', T.status === 'overtime');

  if (isOT) {
    document.getElementById('level-label').textContent = T.status === 'overtime' ? '加時賽' : '加時賽結束';
    const blinds = (cl && !cl.is_break) ? cl : null;
    document.getElementById('sb').textContent   = blinds ? numK(blinds.small_blind) : '-';
    document.getElementById('bb').textContent   = blinds ? numK(blinds.big_blind)   : '-';
    document.getElementById('ante').textContent = blinds ? numK(blinds.ante)        : '-';
    document.getElementById('next-preview').textContent = '';
    if (T.status === 'overtime_done') {
      const m = T.overtime_minutes || 0;
      document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:00`;
      document.getElementById('timer').className = 'timer';
      document.getElementById('rebuy-info').textContent = `加時賽共 ${m} 分鐘 · 比賽結束`;
    }
    return;
  }

  if (cl) {
    if (cl.is_break) {
      document.getElementById('level-label').textContent = '休息時間';
      document.getElementById('sb').textContent = '-';
      document.getElementById('bb').textContent = '-';
      document.getElementById('ante').textContent = '-';
    } else {
      document.getElementById('level-label').textContent = `LEVEL ${cl.level_number || T.current_level}`;
      document.getElementById('sb').textContent = numK(cl.small_blind);
      document.getElementById('bb').textContent = numK(cl.big_blind);
      document.getElementById('ante').textContent = numK(cl.ante);
    }
    if (nl) {
      document.getElementById('next-preview').textContent = nl.is_break
        ? '下一個：休息'
        : `下一級：SB ${num(nl.small_blind)} / BB ${num(nl.big_blind)}${nl.ante ? ` / Ante ${num(nl.ante)}` : ''}`;
    } else {
      document.getElementById('next-preview').textContent = '最後一級';
    }
  }
  tick();
}

function tick() {
  if (!T || T.status === 'overtime' || T.status === 'overtime_done') return;
  const rem = remainingSecs();
  const timerEl = document.getElementById('timer');
  timerEl.textContent = fmt(rem);
  timerEl.className = 'timer' + (rem <= 30 ? ' danger' : rem <= 60 ? ' warning' : '');
  const s = Math.floor(rem);
  if ((T.status === 'running' || T.status === 'break') && s >= 55 && s <= 60 && _warnKey !== T.level_start_at) {
    _warnKey = T.level_start_at;
    muyu(1);
  }
}

// ── 音效：木魚（真實錄音，base64 內嵌 6.6KB）────────
// Level 開始 3 聲、倒數 1 分鐘 1 聲。瀏覽器規定要先有一次點擊/觸控才准出聲，
// 電視盒用遙控器按一下畫面即可（跟 Wake Lock 共用同一次手勢）。

let _muyuBuf = null;
async function loadMuyu() {
  if (_muyuBuf) return _muyuBuf;
  const bin = atob(MUYU_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  _muyuBuf = await _ac.decodeAudioData(bytes.buffer);
  return _muyuBuf;
}
async function muyu(count, gap = 0.42) {
  unlockAudio();
  const buf = await loadMuyu();
  let t = _ac.currentTime + 0.02;
  for (let i = 0; i < count; i++) {
    const src = _ac.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 1 + (Math.random() - 0.5) * 0.04;   // 每下 ±2% 微幅不同
    const g = _ac.createGain(); g.gain.value = 0.9 + Math.random() * 0.2;
    src.connect(g); g.connect(_ac.destination);
    src.start(t);
    t += gap;
  }
}
loadMuyu();

// Level 開始：級別變化且進行中才響；首次載入、暫停/繼續、加時賽不響
let _sndLevel;   // undefined = 尚未初始化
function checkLevelSound() {
  if (!T) return;
  const active = T.status === 'running' || T.status === 'break';
  if (_sndLevel === undefined) { _sndLevel = active ? T.current_level : null; return; }
  if (!active) {
    if (T.status === 'idle' || T.status === 'finished') _sndLevel = null;
    return;
  }
  if (_sndLevel !== T.current_level) { muyu(3); _sndLevel = T.current_level; }
}
let _warnKey = null;   // 倒數 1 分鐘：每級一次，以 level_start_at 為 key

// 加時賽結束：狀態轉為 overtime_done 時敲 3 下；首次載入若已是結束狀態不響
let _otDoneSeen;   // undefined = 尚未初始化
function checkOvertimeDoneSound() {
  if (!T) return;
  const done = T.status === 'overtime_done';
  if (_otDoneSeen === undefined) { _otDoneSeen = done; return; }
  if (done && !_otDoneSeen) muyu(3);
  _otDoneSeen = done;
}

// ── Wake Lock（防止螢幕自動關閉）────────────────────
let wakeLock = null;
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch(e) {}
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
document.addEventListener('click', requestWakeLock, { once: true });
document.addEventListener('touchstart', requestWakeLock, { once: true });
document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true });

// ── Init ─────────────────────────────────────────────
load();
subscribe();
setInterval(tick, 1000);
setInterval(load, 3000); // polling fallback if Realtime is not enabled
